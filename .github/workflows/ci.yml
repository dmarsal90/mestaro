name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: mestaro_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: platform
      DB_PASSWORD: ci-only
      DB_DATABASE: mestaro_platform_test
      APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTAxMjM0NTY=
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, bcmath, sodium
          coverage: none
      - run: touch .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: vendor/bin/pest
