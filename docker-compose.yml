# Mestaro development stack. Every PHP process uses the same image; each service bind-mounts its own code.
x-php: &php
  image: mestaro-php-dev:latest
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  networks: [internal]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

x-platform-env: &platform-env
  APP_ENV: local
  HASH_DRIVER: argon2id
  APP_KEY: ${PLATFORM_APP_KEY:?set PLATFORM_APP_KEY in .env}
  JWT_PRIVATE_KEY: ${PLATFORM_JWT_PRIVATE_KEY:?set PLATFORM_JWT_PRIVATE_KEY in .env}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: mestaro_platform
  DB_USERNAME: platform
  DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD in .env}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  CACHE_STORE: redis
  # Own prefix per service: they share one Redis, and `migrate --isolated` locks through the cache, so with a shared
  # prefix a service that starts at the same time as another silently skips its migrations.
  CACHE_PREFIX: platform-
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  # Services that must report before a restaurant activates; add each new service before it starts answering.
  TENANCY_SERVICES: ${TENANCY_SERVICES:-platform,catalog,operations,billing}
  # Services verify access tokens against this issuer; it must be the same string everywhere.
  JWT_ISSUER: mestaro-platform
  # Only peers on the internal network (the gateway, which overwrites X-Forwarded-For) may set it.
  TRUSTED_PROXIES: ${INTERNAL_SUBNET:-172.31.250.0/24}

# Settings every business service shares; each service adds its own key and database below.
x-service-env: &service-env
  APP_ENV: local
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  JWKS_URL: http://gateway/.well-known/jwks.json
  JWT_ISSUER: mestaro-platform
  TRUSTED_PROXIES: ${INTERNAL_SUBNET:-172.31.250.0/24}

x-catalog-env: &catalog-env
  <<: *service-env
  CACHE_PREFIX: catalog-
  APP_KEY: ${CATALOG_APP_KEY:?set CATALOG_APP_KEY in .env}
  DB_DATABASE: mestaro_catalog
  DB_USERNAME: catalog
  DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env} # ggignore: variable reference, the value lives in .env

x-operations-env: &operations-env
  <<: *service-env
  CACHE_PREFIX: operations-
  APP_KEY: ${OPERATIONS_APP_KEY:?set OPERATIONS_APP_KEY in .env}
  DB_DATABASE: mestaro_operations
  DB_USERNAME: operations
  DB_PASSWORD: ${OPERATIONS_DB_PASSWORD:?set OPERATIONS_DB_PASSWORD in .env} # ggignore: variable reference, the value lives in .env

x-billing-env: &billing-env
  <<: *service-env
  CACHE_PREFIX: billing-
  APP_KEY: ${BILLING_APP_KEY:?set BILLING_APP_KEY in .env}
  DB_DATABASE: mestaro_billing
  DB_USERNAME: billing
  DB_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD in .env} # ggignore: variable reference, the value lives in .env


services:
  platform:
    <<: *php
    command: fpm
    working_dir: /var/www/html
    volumes:
      - ./services/platform:/var/www/html
      - ./packages:/var/packages
    environment:
      <<: *platform-env
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: [CMD, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 5

  platform-worker:
    <<: *php
    command: worker
    volumes:
      - ./services/platform:/var/www/html
      - ./packages:/var/packages
    environment: *platform-env

  platform-relay:
    <<: *php
    command: [php, artisan, outbox:relay]
    restart: unless-stopped
    volumes:
      - ./services/platform:/var/www/html
      - ./packages:/var/packages
    environment: *platform-env

  platform-consumer:
    <<: *php
    command: [php, artisan, events:consume]
    restart: unless-stopped
    volumes:
      - ./services/platform:/var/www/html
      - ./packages:/var/packages
    environment: *platform-env

  catalog:
    <<: *php
    command: fpm
    working_dir: /var/www/html
    volumes:
      - ./services/catalog:/var/www/html
      - ./packages:/var/packages
    environment:
      <<: *catalog-env
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: [CMD, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-relay:
    <<: *php
    command: [php, artisan, outbox:relay]
    restart: unless-stopped
    volumes:
      - ./services/catalog:/var/www/html
      - ./packages:/var/packages
    environment: *catalog-env

  catalog-consumer:
    <<: *php
    command: [php, artisan, events:consume]
    restart: unless-stopped
    volumes:
      - ./services/catalog:/var/www/html
      - ./packages:/var/packages
    environment: *catalog-env

  operations:
    <<: *php
    command: fpm
    working_dir: /var/www/html
    volumes:
      - ./services/operations:/var/www/html
      - ./packages:/var/packages
    environment:
      <<: *operations-env
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: [CMD, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 5

  operations-relay:
    <<: *php
    command: [php, artisan, outbox:relay]
    restart: unless-stopped
    volumes:
      - ./services/operations:/var/www/html
      - ./packages:/var/packages
    environment: *operations-env

  operations-consumer:
    <<: *php
    command: [php, artisan, events:consume]
    restart: unless-stopped
    volumes:
      - ./services/operations:/var/www/html
      - ./packages:/var/packages
    environment: *operations-env

  billing:
    <<: *php
    command: fpm
    working_dir: /var/www/html
    volumes:
      - ./services/billing:/var/www/html
      - ./packages:/var/packages
    environment:
      <<: *billing-env
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: [CMD, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-relay:
    <<: *php
    command: [php, artisan, outbox:relay]
    restart: unless-stopped
    volumes:
      - ./services/billing:/var/www/html
      - ./packages:/var/packages
    environment: *billing-env

  billing-consumer:
    <<: *php
    command: [php, artisan, events:consume]
    restart: unless-stopped
    volumes:
      - ./services/billing:/var/www/html
      - ./packages:/var/packages
    environment: *billing-env

  gateway:
    image: nginx:1.31.8-alpine
    ports: ["${GATEWAY_PORT:-8100}:80"]
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [platform, catalog, operations, billing]
    networks: [internal, edge]

  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}
      OPERATIONS_DB_PASSWORD: ${OPERATIONS_DB_PASSWORD:?set OPERATIONS_DB_PASSWORD in .env}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:8.10.2-alpine
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ["${MAILPIT_PORT:-8125}:8025"]
    networks: [internal, edge]

volumes:
  postgres-data:
  redis-data:

networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:-172.31.250.0/24}
  edge:
