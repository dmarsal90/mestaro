# Dev gateway: routes /api/v1 by prefix to the owning service, and the platform admin panel (Filament) at /admin.
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/api/v1/(auth|admin|restaurants|users|settings|staff)(/|$) {
        include fastcgi_params;
        fastcgi_pass platform:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    }

    location ~ ^/api/v1/(zones|tables|categories|products|media)(/|$) {
        include fastcgi_params;
        fastcgi_pass catalog:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    }

    location ~ ^/api/v1/(public|session|orders|order-items|waiter-calls|kds)(/|$) {
        include fastcgi_params;
        fastcgi_pass operations:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    }

    location ~ ^/api/v1/(payments|webhooks|inventory)(/|$) {
        include fastcgi_params;
        fastcgi_pass billing:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    }

    # Admin panel: pages and Livewire endpoints go to platform; its published assets are served from a read-only mount.
    location ~ ^/(admin|livewire-[0-9a-f]+|filament)(/|$) {
        include fastcgi_params;
        fastcgi_pass platform:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    }

    location ~ ^/(js|css|fonts)/filament/ {
        root /var/www/platform-public;
        try_files $uri =404;
        expires 1h;
        # add_header in a location drops the server-level ones: repeat them.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location = /.well-known/jwks.json {
        include fastcgi_params;
        fastcgi_pass platform:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    }

    location / { return 404; }
}
