<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mestaro</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <script>
      // Applies the saved theme before first paint so there is no flash; without one, the system preference decides (tokens.css).
      try {
        var t = localStorage.getItem('mestaro-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
