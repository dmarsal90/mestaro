  /public/tables/{qr_token}:
    x-service: operations
    get:
      summary: Mesa del QR escaneado
      description: Pública. Identifica la mesa; no autoriza nada.
      security: []
      parameters:
        - { name: qr_token, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
      responses:
        '200':
          description: Mesa y si ya tiene sesión
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, required: [table, has_session], properties: { table: { type: object, required: [label], properties: { label: { type: string } } }, has_session: { type: boolean } } }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /public/tables/{qr_token}/sessions:
    x-service: operations
    post:
      summary: Abrir la sesión de la mesa
      description: Pública. Solo si la mesa no tiene sesión (`409 SESSION_EXISTS`); queda `pending_approval` si el restaurante exige aprobación.
      security: []
      parameters:
        - { name: qr_token, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: [string, "null"], maxLength: 40 }
      responses:
        '201':
          description: Credencial del primer participante
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ParticipantCredential' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /public/sessions/join:
    x-service: operations
    post:
      summary: Unirse a la sesión de la mesa con su código
      description: Pública. 5 códigos erróneos en 10 minutos por dirección y mesa (30 por mesa) bloquean con `429 JOIN_CODE_LOCKED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token, join_code]
              properties:
                qr_token: { type: string }
                join_code: { type: string, minLength: 6, maxLength: 6 }
                display_name: { type: [string, "null"], maxLength: 40 }
      responses:
        '201':
          description: Credencial del participante
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ParticipantCredential' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /session:
    x-service: operations
    get:
      summary: La sesión del participante
      description: Credencial de participante. `409 SESSION_CLOSED` cuando la sesión ha terminado.
      security:
        - participantAuth: []
      responses:
        '200':
          description: Sesión, participante y número de participantes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, required: [session, me, participants], properties: { session: { $ref: '#/components/schemas/DinerSession' }, me: { type: object, required: [id], properties: { id: { $ref: '#/components/schemas/Ulid' }, display_name: { type: [string, "null"] } } }, participants: { type: integer } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /sessions:
    x-service: operations
    get:
      summary: Sesiones activas del restaurante
      description: Requiere `orders.view`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StaffSession' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /sessions/{id}/approve:
    x-service: operations
    post:
      summary: Aprobar una sesión pendiente
      description: Requiere `orders.accept`.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StaffSession' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /sessions/{id}/close:
    x-service: operations
    post:
      summary: Cerrar o rechazar una sesión
      description: Requiere `orders.accept`.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StaffSession' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    participantAuth:
      type: http
      scheme: bearer
      description: Credencial opaca de participante emitida por `operations`.
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SessionStatus:
      type: string
      enum: [pending_approval, open, bill_requested, closed, expired]
    DinerSession:
      type: object
      required: [id, status, table_label, join_code]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        status: { $ref: '#/components/schemas/SessionStatus' }
        table_label: { type: [string, "null"] }
        join_code: { type: [string, "null"], pattern: '^[2-9A-HJKMNP-Z]{6}$' }
    ParticipantCredential:
      type: object
      required: [participant_token, session]
      properties:
        participant_token: { type: string }
        session: { $ref: '#/components/schemas/DinerSession' }
    StaffSession:
      type: object
      required: [id, table_id, table_label, status, join_code, version, created_at, participants]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        table_id: { $ref: '#/components/schemas/Ulid' }
        table_label: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/SessionStatus' }
        join_code: { type: string }
        version: { type: integer }
        created_at: { type: string }
        participants: { type: integer }
    Ulid:
      type: string
      description: Los ids de usuario salen en minúsculas y los de restaurante en mayúsculas; se comparan tal cual, sin normalizar.
      pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Unidad mínima de la moneda
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    Zone:
      type: object
      required: [id, name, sort_order, is_active]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }
    Table:
      type: object
      required: [id, zone_id, label, capacity, is_active]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        zone_id: { $ref: '#/components/schemas/Ulid' }
        label: { type: string }
        capacity: { type: integer }
        is_active: { type: boolean }
        qr_token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        qr_rotated_at: { type: [string, 'null'] }
    Allergen:
      type: string
      enum: [gluten, crustaceans, eggs, fish, peanuts, soy, milk, nuts, celery, mustard, sesame, sulphites, lupin, molluscs]
    Category:
      type: object
      required: [id, name, description, sort_order, is_active]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        description: { type: [string, 'null'] }
        sort_order: { type: integer }
        is_active: { type: boolean }
    Variant:
      type: object
      required: [id, name, price_delta, is_default, is_available]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        price_delta: { type: integer }
        is_default: { type: boolean }
        is_available: { type: boolean }
    Addon:
      type: object
      required: [id, name, price, max_quantity, is_available]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        price: { type: integer }
        max_quantity: { type: integer }
        is_available: { type: boolean }
    Product:
      type: object
      required: [id, category_id, name, description, image_url, price, tax_bps, destination, allergens, ingredients, available_from, available_until, is_available, is_sold_out, sort_order, variants, addons]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        category_id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        description: { type: [string, 'null'] }
        image_url: { type: [string, 'null'], description: Ruta relativa a /media }
        price: { type: integer }
        tax_bps: { type: [integer, 'null'] }
        destination: { type: string, enum: [kitchen, bar, other] }
        allergens: { type: array, items: { $ref: '#/components/schemas/Allergen' } }
        ingredients: { type: array, items: { type: string } }
        available_from: { type: [string, 'null'] }
        available_until: { type: [string, 'null'] }
        is_available: { type: boolean }
        is_sold_out: { type: boolean }
        sort_order: { type: integer }
        variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
        addons: { type: array, items: { $ref: '#/components/schemas/Addon' } }
    StaffRole:
      type: string
      enum: [restaurant_admin, manager, waiter, kitchen, bar]
    Tokens:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        refresh_token: { type: string }
    TokensResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Tokens' }
    RestaurantChoiceResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [restaurants]
          properties:
            restaurants:
              type: array
              items:
                type: object
                required: [id, name]
                properties:
                  id: { $ref: '#/components/schemas/Ulid' }
                  name: { type: string }
    Me:
      type: object
      required: [id, name, email, role, tenant_id, permissions]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        tenant_id: { type: [string, 'null'] }
        permissions:
          type: array
          items: { type: string }
    StaffMember:
      type: object
      required: [id, name, email, role, is_active]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/StaffRole' }
        is_active: { type: boolean }
    OpeningHours:
      type: object
      description: Por día de la semana, hasta 4 tramos `HH:MM`.
      additionalProperties: false
      properties:
        mon: { $ref: '#/components/schemas/DayRanges' }
        tue: { $ref: '#/components/schemas/DayRanges' }
        wed: { $ref: '#/components/schemas/DayRanges' }
        thu: { $ref: '#/components/schemas/DayRanges' }
        fri: { $ref: '#/components/schemas/DayRanges' }
        sat: { $ref: '#/components/schemas/DayRanges' }
        sun: { $ref: '#/components/schemas/DayRanges' }
    DayRanges:
      type: array
      maxItems: 4
      items:
        type: object
        required: [open, close]
        additionalProperties: false
        properties:
          open: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
          close: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    Settings:
      type: object
      required:
        - currency
        - timezone
        - locale
        - opening_hours
        - auto_accept_orders
        - require_waiter_approval_for_session
        - prices_include_tax
        - default_tax_bps
        - join_code_reuse_cooldown_minutes
        - order_alert_threshold_seconds
        - preferences
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        timezone: { type: string }
        locale: { type: string, pattern: '^[a-z]{2,3}(-[A-Z]{2})?$' }
        opening_hours:
          oneOf:
            - { $ref: '#/components/schemas/OpeningHours' }
            - { type: 'null' }
        auto_accept_orders: { type: boolean }
        require_waiter_approval_for_session: { type: boolean }
        prices_include_tax: { type: boolean }
        default_tax_bps: { type: integer, minimum: 0, maximum: 10000 }
        join_code_reuse_cooldown_minutes: { type: integer, minimum: 0, maximum: 1440 }
        order_alert_threshold_seconds: { type: integer, minimum: 30, maximum: 86400 }
        preferences:
          type: [object, 'null']
          description: Hasta 8 KB de JSON.
    SettingsUpdate:
      type: object
      description: Todos los campos son opcionales; solo se cambian los enviados.
      additionalProperties: false
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        timezone: { type: string }
        locale: { type: string, pattern: '^[a-z]{2,3}(-[A-Z]{2})?$' }
        opening_hours:
          oneOf:
            - { $ref: '#/components/schemas/OpeningHours' }
            - { type: 'null' }
        auto_accept_orders: { type: boolean }
        require_waiter_approval_for_session: { type: boolean }
        prices_include_tax: { type: boolean }
        default_tax_bps: { type: integer, minimum: 0, maximum: 10000 }
        join_code_reuse_cooldown_minutes: { type: integer, minimum: 0, maximum: 1440 }
        order_alert_threshold_seconds: { type: integer, minimum: 30, maximum: 86400 }
        preferences: { type: [object, 'null'] }
    Restaurant:
      type: object
      required: [id, name, slug, status, failure_reason]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        slug: { type: string, pattern: '^[a-z][a-z0-9]{2,29}$' }
        status: { type: string, enum: [provisioning, active, provisioning_failed, suspended] }
        failure_reason: { type: [string, 'null'] }
    RestaurantResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Restaurant' }
    PageMeta:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page: { type: integer }
        per_page: { type: integer, maximum: 100 }
        total: { type: integer }
        last_page: { type: integer }
    PageLinks:
      type: object
      properties:
        first: { type: [string, 'null'] }
        last: { type: [string, 'null'] }
        prev: { type: [string, 'null'] }
        next: { type: [string, 'null'] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
