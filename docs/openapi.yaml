openapi: 3.1.0
info:
  title: Mestaro API
  version: 0.2.0
  description: |
    Contrato de `platform` (auth, ajustes, personal, administración de restaurantes) y `catalog`
    (rutas con `x-service: catalog`). Los demás servicios añaden sus endpoints en su fase. `tests/Feature/OpenApiContractTest.php` comprueba que cada ruta existe aquí
    y que las respuestas reales cumplen estos esquemas.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Iniciar sesión
      description: >
        Administradores de plataforma y personal con membresía activa. Si el personal pertenece a varios
        restaurantes, responde la lista y el cliente repite la petición con `restaurant_id`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
                restaurant_id: { $ref: '#/components/schemas/Ulid' }
      responses:
        '200':
          description: Tokens, o restaurantes entre los que elegir
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokensResponse'
                  - $ref: '#/components/schemas/RestaurantChoiceResponse'
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      summary: Renovar tokens (el refresh token es de un solo uso)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Tokens nuevos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokensResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: Cerrar sesión (revoca refresh tokens y el JWT usado)
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      summary: Usuario autenticado y su ámbito
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/forgot-password:
    post:
      summary: Pedir enlace de recuperación (responde igual exista o no la cuenta)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { description: Aceptada }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/reset-password:
    post:
      summary: Fijar contraseña nueva con el token del enlace (cierra todas las sesiones)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                token: { type: string, maxLength: 255 }
                password: { type: string, minLength: 12, maxLength: 1024 }
                password_confirmation: { type: string }
      responses:
        '204': { description: Contraseña cambiada }
        '422':
          description: Datos inválidos o `INVALID_RESET_TOKEN`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/accept-invitation:
    post:
      summary: Aceptar una invitación al personal
      description: >
        Con cuenta nueva, `password` pasa a ser su contraseña (mínimo 12). Con una cuenta existente debe ser la
        contraseña de esa cuenta: es su consentimiento para unirse.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 255 }
                password: { type: string, maxLength: 1024 }
      responses:
        '204': { description: Invitación aceptada }
        '409':
          description: '`ALREADY_MEMBER`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Datos inválidos, `INVALID_INVITATION` o `INVALID_CREDENTIALS`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /settings:
    get:
      summary: Ajustes del restaurante del token
      description: Cualquier personal del restaurante. Sin fila guardada devuelve los valores por defecto.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      summary: Cambiar ajustes (parcial)
      description: Requiere el permiso `restaurant.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdate' }
      responses:
        '200':
          description: Ajustes resultantes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /staff:
    get:
      summary: Personal del restaurante del token
      description: Requiere el permiso `users.manage`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StaffMember' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Invitar a una persona
      description: >
        Requiere `users.manage`. No crea ni modifica ninguna cuenta: guarda una invitación (caduca a los 7 días;
        invitar de nuevo sustituye la pendiente) y envía el enlace por correo. La persona entra al restaurante
        solo al aceptarla en `/auth/accept-invitation`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                role: { $ref: '#/components/schemas/StaffRole' }
      responses:
        '201': { description: Aceptada }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: '`ALREADY_MEMBER`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /staff/{id}:
    patch:
      summary: Cambiar rol o acceso (revoca sus JWT abiertos en este restaurante)
      description: Requiere `users.manage`. Nadie puede modificarse a sí mismo (`CANNOT_MODIFY_SELF`).
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/StaffRole' }
                is_active: { type: boolean }
      responses:
        '200':
          description: Miembro actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StaffMember' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/restaurants:
    post:
      summary: Registrar un restaurante (inicia la provisión)
      description: Solo administradores de plataforma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, maxLength: 120 }
                slug: { type: string, pattern: '^[a-z][a-z0-9]{2,29}$' }
      responses:
        '202':
          description: Registrado; queda en `provisioning`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: '`SLUG_TAKEN`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/restaurants/{id}:
    get:
      summary: Consultar un restaurante
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/restaurants/{id}/suspend:
    post:
      summary: Suspender un restaurante activo
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      responses:
        '200':
          description: Suspendido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/restaurants/{id}/retry-provisioning:
    post:
      summary: Reintentar la provisión de un restaurante en `provisioning_failed`
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      responses:
        '202':
          description: Reintento en curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /zones:
    x-service: catalog
    get:
      summary: Zonas del restaurante del token
      description: Cualquier personal del restaurante.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Crear una zona
      description: Requiere `floor.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
                sort_order: { type: integer, minimum: 0, maximum: 65535 }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /zones/{id}:
    x-service: catalog
    patch:
      summary: Cambiar nombre, orden o estado de una zona
      description: Requiere `floor.manage`. Una zona inactiva no admite mesas nuevas.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                sort_order: { type: integer, minimum: 0, maximum: 65535 }
                is_active: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /tables:
    x-service: catalog
    get:
      summary: Mesas del restaurante del token
      description: Cualquier personal. `qr_token` y `qr_rotated_at` solo se devuelven con `floor.manage`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Table' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Crear una mesa con su QR
      description: Requiere `floor.manage`. La zona debe existir y estar activa (`422 INVALID_ZONE`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zone_id, label, capacity]
              properties:
                zone_id: { $ref: '#/components/schemas/Ulid' }
                label: { type: string, maxLength: 40 }
                capacity: { type: integer, minimum: 1, maximum: 65535 }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Table' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /tables/{id}:
    x-service: catalog
    patch:
      summary: Cambiar zona, etiqueta, capacidad o estado de una mesa
      description: Requiere `floor.manage`.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zone_id: { $ref: '#/components/schemas/Ulid' }
                label: { type: string, maxLength: 40 }
                capacity: { type: integer, minimum: 1, maximum: 65535 }
                is_active: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Table' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /tables/{id}/qr/rotate:
    x-service: catalog
    post:
      summary: Rotar el QR de una mesa (el anterior deja de valer)
      description: Requiere `floor.manage`.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Table' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /categories:
    x-service: catalog
    get:
      summary: Categorías de la carta
      description: Cualquier personal del restaurante.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Crear una categoría
      description: Requiere `menu.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: [string, 'null'], maxLength: 500 }
                sort_order: { type: integer, minimum: 0, maximum: 65535 }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /categories/{id}:
    x-service: catalog
    patch:
      summary: Cambiar una categoría (se desactiva, no se borra)
      description: Requiere `menu.manage`. No admite productos nuevos si está inactiva.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: [string, 'null'], maxLength: 500 }
                sort_order: { type: integer, minimum: 0, maximum: 65535 }
                is_active: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /products:
    x-service: catalog
    get:
      summary: Productos con sus variantes y complementos
      description: Cualquier personal. Filtro opcional `category_id`. Los borrados no aparecen.
      parameters:
        - { name: category_id, in: query, required: false, schema: { $ref: '#/components/schemas/Ulid' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Crear un producto
      description: Requiere `menu.manage`. La categoría debe estar activa (`422 INVALID_CATEGORY`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, name, price]
              properties:
                category_id: { $ref: '#/components/schemas/Ulid' }
                name: { type: string, maxLength: 120 }
                description: { type: [string, 'null'], maxLength: 1000 }
                price: { type: integer, minimum: 0, maximum: 100000000, description: Unidad mínima (céntimos) }
                tax_bps: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
                destination: { type: string, enum: [kitchen, bar, other] }
                allergens: { type: array, maxItems: 14, uniqueItems: true, items: { $ref: '#/components/schemas/Allergen' } }
                ingredients: { type: array, maxItems: 40, items: { type: string, maxLength: 60 } }
                available_from: { type: [string, 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$', description: Hora local del restaurante }
                available_until: { type: [string, 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$' }
                is_available: { type: boolean }
                is_sold_out: { type: boolean }
                sort_order: { type: integer, minimum: 0, maximum: 65535 }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /products/{id}:
    x-service: catalog
    patch:
      summary: Cambiar un producto, su disponibilidad o su horario
      description: Requiere `menu.manage`.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id: { $ref: '#/components/schemas/Ulid' }
                name: { type: string, maxLength: 120 }
                description: { type: [string, 'null'], maxLength: 1000 }
                price: { type: integer, minimum: 0, maximum: 100000000, description: Unidad mínima (céntimos) }
                tax_bps: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
                destination: { type: string, enum: [kitchen, bar, other] }
                allergens: { type: array, maxItems: 14, uniqueItems: true, items: { $ref: '#/components/schemas/Allergen' } }
                ingredients: { type: array, maxItems: 40, items: { type: string, maxLength: 60 } }
                available_from: { type: [string, 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$', description: Hora local del restaurante }
                available_until: { type: [string, 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$' }
                is_available: { type: boolean }
                is_sold_out: { type: boolean }
                sort_order: { type: integer, minimum: 0, maximum: 65535 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Borrar un producto (borrado lógico)
      description: Requiere `menu.manage`.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      responses:
        '204': { description: Borrado }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /products/{id}/image:
    x-service: catalog
    post:
      summary: Subir o reemplazar la foto del producto
      description: >
        Requiere `menu.manage`. `multipart/form-data` con `image` (JPEG, PNG o WebP según el contenido real, máx.
        2 MB y 4000x4000 px). SVG y cualquier otro tipo se rechazan.
      parameters:
        - { $ref: '#/components/parameters/PathId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        '201':
          description: Guardada
          content:
            application/json:
